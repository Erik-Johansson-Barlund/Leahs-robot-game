<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <radialGradient id="shine" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 -30) rotate(90) scale(190)">
      <stop stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Robot 1: Green -->
  <g transform="translate(256 256)" filter="url(#softShadow)">
    <circle r="170" fill="#22C55E"/>
    <circle r="152" fill="#34D399"/>
