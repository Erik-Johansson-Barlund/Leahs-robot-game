    <rect x="16" y="-30" width="40" height="38" rx="18" fill="#0F172A"/>
    <circle cx="-38" cy="-20" r="4" fill="#FFFFFF"/>
    <circle cx="34" cy="-20" r="4" fill="#FFFFFF"/>
    <rect x="-66" y="54" width="132" height="22" rx="11" fill="#2563EB"/>
    <rect x="-24" y="-208" width="48" height="24" rx="12" fill="#1D4ED8"/>
    <circle cx="-16" cy="-196" r="8" fill="#DBEAFE"/>
