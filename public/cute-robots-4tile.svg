    <rect x="-62" y="56" width="124" height="20" rx="10" fill="#10B981"/>
    <circle cx="0" cy="-192" r="14" fill="#86EFAC"/>
    <rect x="-7" y="-186" width="14" height="36" rx="7" fill="#16A34A"/>
    <circle r="145" fill="url(#shine)"/>
    <circle r="170" stroke="#166534" stroke-width="10"/>
  </g>

  <!-- Robot 2: Red -->
