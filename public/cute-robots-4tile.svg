    <circle cx="36" cy="-16" r="5" fill="#FFFFFF"/>
    <rect x="-70" y="56" width="140" height="22" rx="11" fill="#DC2626"/>
    <circle cx="-58" cy="56" r="12" fill="#FCA5A5"/>
    <circle cx="58" cy="56" r="12" fill="#FCA5A5"/>
    <path d="M-10 -196 L10 -196 L18 -154 L-18 -154 Z" fill="#B91C1C"/>
    <circle cx="0" cy="-202" r="13" fill="#FECACA"/>
    <circle r="145" fill="url(#shine)"/>
    <circle r="170" stroke="#7F1D1D" stroke-width="10"/>
  </g>

  <!-- Robot 3: Blue -->
